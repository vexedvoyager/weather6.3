name: Run Same-Day Study

# Manual only. "Does the market lag the thermometer?" (see src/sameday.py and
# "claude/backtest-plan.md" in the Weather Bot Claude project). Downloads station
# observations (Iowa Environmental Mesonet METAR archive) and Kalshi's hourly
# prices across each market day for the daily-HIGH markets already in
# data/backtest.db. Never trades; never touches data/trades.db or data/backtest.db
# (read only). Everything goes into data/sameday.db, saved after EACH month, so a
# stopped run resumes when the same months are run again.
#
# About 10-15 minutes per month. Do up to ~12 months per run.
# When it finishes, download the "sameday-report" artifact and upload it to Claude.
on:
  workflow_dispatch:
    inputs:
      months:
        description: "Months, e.g. 2024-11..2025-10 (leave empty to only rebuild the report)"
        required: false
        default: ""

concurrency:
  group: sameday-db-writer       # one at a time; never blocks Price Check or the backtest
  cancel-in-progress: false

jobs:
  sameday:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect observations and intraday prices (saving after each month)
        if: github.event.inputs.months != ''
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          MONTHS: ${{ github.event.inputs.months }}
        run: |
          # Saves files to the repo WITHOUT ever leaving this checkout mid-rebase (the cause of
          # the first lows run's "exit code 1"): each try starts from a fresh copy of the latest
          # remote branch in a separate folder, copies our files in, commits and pushes. This
          # job is the only writer of these files, so overwriting them is correct. A failed
          # save never fails the run - the artifact has the data and re-running resumes.
          publish() {
            msg="$1"; shift
            for i in 1 2 3 4 5 6; do
              rm -rf /tmp/pub; git worktree prune
              if git fetch -q origin "$GITHUB_REF_NAME" && git worktree add -q --detach /tmp/pub FETCH_HEAD; then
                added=""
                for f in "$@"; do
                  if [ -d "$f" ]; then mkdir -p "/tmp/pub/$f"; cp -r "$f/." "/tmp/pub/$f/"; added="$added $f"
                  elif [ -f "$f" ]; then mkdir -p "/tmp/pub/$(dirname "$f")"; cp "$f" "/tmp/pub/$f"; added="$added $f"; fi
                done
                if [ -z "$added" ]; then return 0; fi
                if (cd /tmp/pub && git add $added && { git diff --cached --quiet || \
                      { git -c user.name="predict-weather-bot" -c user.email="actions@github.com" commit -q -m "$msg" && \
                        git push -q origin "HEAD:$GITHUB_REF_NAME"; }; }); then
                  rm -rf /tmp/pub; git worktree prune; return 0
                fi
              fi
              echo "save attempt $i failed; retrying"
              sleep $((i * 15))
            done
            echo "::warning::could not save $* to the repo after 6 tries; it is in the downloadable artifact, and re-running the same months resumes"
            return 0
          }
          for m in $(python -c "from src.backtest import parse_months; import os; print(' '.join(f'{y}-{mo:02d}' for y, mo in parse_months(os.environ['MONTHS'])))"); do
            echo "::group::Month $m"
            python -m src.sameday --months "$m"
            echo "::endgroup::"
            publish "Same-day study data $m" data/sameday.db
          done

      - name: Build report
        if: always()
        run: python -m src.sameday_report | tee sameday_report.txt

      - name: Save report to repo
        if: always()
        run: |
          # Saves files to the repo WITHOUT ever leaving this checkout mid-rebase (the cause of
          # the first lows run's "exit code 1"): each try starts from a fresh copy of the latest
          # remote branch in a separate folder, copies our files in, commits and pushes. This
          # job is the only writer of these files, so overwriting them is correct. A failed
          # save never fails the run - the artifact has the data and re-running resumes.
          publish() {
            msg="$1"; shift
            for i in 1 2 3 4 5 6; do
              rm -rf /tmp/pub; git worktree prune
              if git fetch -q origin "$GITHUB_REF_NAME" && git worktree add -q --detach /tmp/pub FETCH_HEAD; then
                added=""
                for f in "$@"; do
                  if [ -d "$f" ]; then mkdir -p "/tmp/pub/$f"; cp -r "$f/." "/tmp/pub/$f/"; added="$added $f"
                  elif [ -f "$f" ]; then mkdir -p "/tmp/pub/$(dirname "$f")"; cp "$f" "/tmp/pub/$f"; added="$added $f"; fi
                done
                if [ -z "$added" ]; then return 0; fi
                if (cd /tmp/pub && git add $added && { git diff --cached --quiet || \
                      { git -c user.name="predict-weather-bot" -c user.email="actions@github.com" commit -q -m "$msg" && \
                        git push -q origin "HEAD:$GITHUB_REF_NAME"; }; }); then
                  rm -rf /tmp/pub; git worktree prune; return 0
                fi
              fi
              echo "save attempt $i failed; retrying"
              sleep $((i * 15))
            done
            echo "::warning::could not save $* to the repo after 6 tries; it is in the downloadable artifact, and re-running the same months resumes"
            return 0
          }
          publish "Same-day study report $(date -u +%Y-%m-%dT%H:%M:%SZ)" data/backtest_reports data/sameday.db

      - name: Upload report and database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sameday-report
          path: |
            sameday_report.txt
            data/sameday.db
          if-no-files-found: ignore
