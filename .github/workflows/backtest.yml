name: Run Backtest

# Manual only. Replays archived NOAA forecasts against settled Kalshi markets
# (see src/backtest.py and "claude/backtest-plan.md" in the Weather Bot Claude
# project). Never trades and never touches data/trades.db: everything goes into
# data/backtest.db, which is saved back to the repo after EACH month - so if a
# run stops part way, just run the same months again and it picks up where it
# left off.
#
# Runs about 10 minutes per month. Do up to ~12 months per run.
# Pick "low" under kind for Kalshi's daily-LOW markets (saved to data/backtest_low.db).
# When it finishes, download the "backtest-report" artifact and upload it to Claude.
on:
  workflow_dispatch:
    inputs:
      months:
        description: "Months to collect, e.g. 2025-03 or 2024-11..2025-10 (leave empty to only rebuild the report)"
        required: false
        default: ""
      kind:
        description: "Daily high or daily low markets"
        type: choice
        options: [high, low]
        default: high
      redo:
        description: "Re-collect days already stored (use only when asked to)"
        type: boolean
        required: false
        default: false

concurrency:
  group: backtest-db-writer      # one backtest at a time; never blocks Price Check
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect months (saving after each one)
        if: github.event.inputs.months != ''
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          MONTHS: ${{ github.event.inputs.months }}
          REDO: ${{ github.event.inputs.redo }}
          KIND: ${{ github.event.inputs.kind }}
        run: |
          DB=data/backtest.db; [ "$KIND" = "low" ] && DB=data/backtest_low.db
          # Saves files to the repo WITHOUT ever leaving this checkout mid-rebase (the cause of
          # the first lows run's "exit code 1"): each try starts from a fresh copy of the latest
          # remote branch in a separate folder, copies our files in, commits and pushes. This
          # job is the only writer of these files, so overwriting them is correct. A failed
          # save never fails the run - the artifact has the data and re-running resumes.
          publish() {
            msg="$1"; shift
            for i in 1 2 3 4 5 6; do
              rm -rf /tmp/pub; git worktree prune
              if git fetch -q origin "$GITHUB_REF_NAME" && git worktree add -q --detach /tmp/pub FETCH_HEAD; then
                added=""
                for f in "$@"; do
                  if [ -d "$f" ]; then mkdir -p "/tmp/pub/$f"; cp -r "$f/." "/tmp/pub/$f/"; added="$added $f"
                  elif [ -f "$f" ]; then mkdir -p "/tmp/pub/$(dirname "$f")"; cp "$f" "/tmp/pub/$f"; added="$added $f"; fi
                done
                if [ -z "$added" ]; then return 0; fi
                if (cd /tmp/pub && git add $added && { git diff --cached --quiet || \
                      { git -c user.name="predict-weather-bot" -c user.email="actions@github.com" commit -q -m "$msg" && \
                        git push -q origin "HEAD:$GITHUB_REF_NAME"; }; }); then
                  rm -rf /tmp/pub; git worktree prune; return 0
                fi
              fi
              echo "save attempt $i failed; retrying"
              sleep $((i * 15))
            done
            echo "::warning::could not save $* to the repo after 6 tries; it is in the downloadable artifact, and re-running the same months resumes"
            return 0
          }
          for m in $(python -c "from src.backtest import parse_months; import os; print(' '.join(f'{y}-{mo:02d}' for y, mo in parse_months(os.environ['MONTHS'])))"); do
            echo "::group::Month $m"
            if [ "$REDO" = "true" ]; then
              python -m src.backtest --kind "$KIND" --months "$m" --redo
            else
              python -m src.backtest --kind "$KIND" --months "$m"
            fi
            echo "::endgroup::"
            publish "Backtest data ($KIND) $m" "$DB"
          done

      - name: Build report
        if: always()
        env:
          KIND: ${{ github.event.inputs.kind }}
        run: python -m src.backtest_report --kind "${KIND:-high}" | tee backtest_report.txt

      - name: Save report to repo
        if: always()
        run: |
          # Saves files to the repo WITHOUT ever leaving this checkout mid-rebase (the cause of
          # the first lows run's "exit code 1"): each try starts from a fresh copy of the latest
          # remote branch in a separate folder, copies our files in, commits and pushes. This
          # job is the only writer of these files, so overwriting them is correct. A failed
          # save never fails the run - the artifact has the data and re-running resumes.
          publish() {
            msg="$1"; shift
            for i in 1 2 3 4 5 6; do
              rm -rf /tmp/pub; git worktree prune
              if git fetch -q origin "$GITHUB_REF_NAME" && git worktree add -q --detach /tmp/pub FETCH_HEAD; then
                added=""
                for f in "$@"; do
                  if [ -d "$f" ]; then mkdir -p "/tmp/pub/$f"; cp -r "$f/." "/tmp/pub/$f/"; added="$added $f"
                  elif [ -f "$f" ]; then mkdir -p "/tmp/pub/$(dirname "$f")"; cp "$f" "/tmp/pub/$f"; added="$added $f"; fi
                done
                if [ -z "$added" ]; then return 0; fi
                if (cd /tmp/pub && git add $added && { git diff --cached --quiet || \
                      { git -c user.name="predict-weather-bot" -c user.email="actions@github.com" commit -q -m "$msg" && \
                        git push -q origin "HEAD:$GITHUB_REF_NAME"; }; }); then
                  rm -rf /tmp/pub; git worktree prune; return 0
                fi
              fi
              echo "save attempt $i failed; retrying"
              sleep $((i * 15))
            done
            echo "::warning::could not save $* to the repo after 6 tries; it is in the downloadable artifact, and re-running the same months resumes"
            return 0
          }
          publish "Backtest report $(date -u +%Y-%m-%dT%H:%M:%SZ)" data/backtest_reports data/backtest.db data/backtest_low.db

      - name: Upload report and database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report-${{ github.event.inputs.kind || 'high' }}
          path: |
            backtest_report.txt
            data/backtest.db
            data/backtest_low.db
          if-no-files-found: ignore
